<!DOCTYPE html>
<html>
<head>
    <title>Login - Loan Approval System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

<div class="container">

    <div class="form-box">

        <h1>Loan Approval</h1>
        <h2>Login</h2>

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <p>
            Don't have an account?
            <a href="{{ url_for('register') }}">Create Account</a>
        </p>

    </div>

</div>

</body>
</html>
