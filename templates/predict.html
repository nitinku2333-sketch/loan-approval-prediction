<!DOCTYPE html>
<html>

<head>

    <title>Loan Prediction</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/predict.css') }}"
    >

</head>

<body>

<div class="form-container">

    <h1>Loan Approval Prediction</h1>

    <p>Enter Applicant Details</p>


    <form method="POST">


        <!-- Gender -->

        <label>Gender</label>

        <select name="gender" required>

            <option value="">Select Gender</option>

            <option value="Male">Male</option>

            <option value="Female">Female</option>

        </select>


        <!-- Married -->

        <label>Married</label>

        <select name="married" required>

            <option value="">Select</option>

            <option value="Yes">Yes</option>

            <option value="No">No</option>

        </select>


        <!-- Dependents -->

        <label>Dependents</label>

        <select name="dependents" required>

            <option value="">Select</option>

            <option value="0">0</option>

            <option value="1">1</option>

            <option value="2">2</option>

            <option value="3+">3+</option>

        </select>


        <!-- Education -->

        <label>Education</label>

        <select name="education" required>

            <option value="">Select Education</option>

            <option value="Graduate">
                Graduate
            </option>

            <option value="Not Graduate">
                Not Graduate
            </option>

        </select>


        <!-- Self Employed -->

        <label>Self Employed</label>

        <select name="self_employed" required>

            <option value="">Select</option>

            <option value="Yes">Yes</option>

            <option value="No">No</option>

        </select>


        <!-- Applicant Income -->

        <label>Applicant Income</label>

        <input
            type="number"
            name="applicant_income"
            placeholder="Enter applicant income"
            required
        >


        <!-- Coapplicant Income -->

        <label>Coapplicant Income</label>

        <input
            type="number"
            name="coapplicant_income"
            placeholder="Enter coapplicant income"
            required
        >


        <!-- Loan Amount -->

        <label>Loan Amount</label>

        <input
            type="number"
            name="loan_amount"
            placeholder="Enter loan amount"
            required
        >


        <!-- Loan Term -->

        <label>Loan Term</label>

        <select name="loan_term" required>

            <option value="">Select Loan Term</option>

            <option value="120">120 Months</option>

            <option value="180">180 Months</option>

            <option value="240">240 Months</option>

            <option value="300">300 Months</option>

            <option value="360">360 Months</option>

        </select>


        <!-- Credit History -->

        <label>Credit History</label>

        <select name="credit_history" required>

            <option value="">Select</option>

            <option value="1">
                Good Credit History
            </option>

            <option value="0">
                Poor Credit History
            </option>

        </select>


        <!-- Property Area -->

        <label>Property Area</label>

        <select name="property_area" required>

            <option value="">Select Property Area</option>

            <option value="Urban">Urban</option>

            <option value="Semiurban">Semiurban</option>

            <option value="Rural">Rural</option>

        </select>


        <button type="submit">
            Predict Loan
        </button>


    </form>


    <a href="{{ url_for('dashboard') }}">
        Back to Dashboard
    </a>

</div>

</body>

</html>
